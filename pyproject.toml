[project]
name = "etl-python-gmail-mysql"
version = "0.4.1"
description = ""
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
packages = [{include = "etl_python_gmail_mysql", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
etl = "etl_python_gmail_mysql.main:main"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "types-pyyaml (>=6.0.12.20260815,<7.0.0.0)"
]

[tool.taskipy.tasks]
app = "etl"
pytest = "poetry run pytest ."
covhtml = "poetry run pytest --cov=etl_python_gmail_mysql --cov-report=html"
covcmd = "poetry run pytest --cov=etl_python_gmail_mysql --cov-report=term-missing"
format = "poetry run ruff format ."
lint = "poetry run ruff check ."
mypy = "poetry run mypy ."
check = "poetry run ruff format --check ."
precommit = "poetry run pre-commit run --all-files"
fix = "poetry run ruff check . --fix"
